server:
  host: "127.0.0.1"
  port: 8000
storage:
  codepilot_home: "~/codepilot"
llm:
  providers:
    openai:
      label: "OpenAI"
      models:
        - id: "gpt-5.3-codex"
          thinking:
            kind: "reasoning_effort"
            allowed_values: ["low", "medium", "high"]
            default_value: "medium"
        - "gpt-4.1"
      litellm_model_prefix: ""
    qwen:
      label: "Qwen"
      models:
        - id: "qwen3.7-plus"
          thinking:
            kind: "extra_body_boolean"
            extra_body_key: "enable_thinking"
            allowed_values: ["on", "off"]
            default_value: "on"
        - id: "qwen3.5-omni-flash"
          thinking:
            kind: "extra_body_boolean"
            extra_body_key: "enable_thinking"
            allowed_values: ["on", "off"]
            default_value: "on"
        - id: "kimi-k2.5"
          thinking:
            kind: "extra_body_boolean"
            extra_body_key: "enable_thinking"
            allowed_values: ["on", "off"]
            default_value: "on"
        - id: "kimi/kimi-k2.5"
          thinking:
            kind: "extra_body_boolean"
            extra_body_key: "enable_thinking"
            allowed_values: ["on", "off"]
            default_value: "on"
        - id: "ZHIPU/GLM-5"
          thinking:
            kind: "extra_body_boolean"
            extra_body_key: "enable_thinking"
            allowed_values: ["on", "off"]
            default_value: "on"
      litellm_model_prefix: "openai/"
    deepseek:
      label: "DeepSeek"
      models:
        - "deepseek-v4-flash"
        - "deepseek-v4-pro"
      litellm_model_prefix: "openai/"
  max_tokens: 4096
  stream: true
  log_requests: false
  title_provider: "deepseek"
  title_model: "deepseek-v4-flash"
agent:
  default_agent_name: "life"
  max_loop_iterations: 200
  subagent_max_loop_iterations: 200
  subagent_max_depth: 1
  max_started_agents: 5
context:
  compression_enabled: true
  model_thresholds:
    default:
      trigger_tokens: 128000
      trigger_ratio:
      context_window_tokens:
  latest_rounds_to_keep: 5
  strategies:
    llm_summary:
      enabled: true
      summary_max_tokens: 2048
    tool_result_placeholder:
      enabled: true 
      keep_latest_tool_results: 10
tools:
  default_timeout_seconds: 120
  default_can_parallel: false
  default_requires_approval: false
  default_error_policy: "return_tool_result"
  bash:
    approval_mode: "all"
    allowlist: []
    blacklist: []
    readonly_allowlist:
      - ["pwd"]
      - ["ls"]
      - ["find"]
      - ["rg"]
      - ["cat"]
      - ["sed"]
      - ["head"]
      - ["tail"]
      - ["wc"]
      - ["git", "status"]
      - ["git", "diff"]
      - ["git", "log"]
      - ["git", "show"]
    max_output_chars: 50000
mcp:
  servers: {}
hooks:
  enabled: true
  default_timeout_seconds: 30
  plugins:
    - hook_id: add_project_rule_prompt
      hook_type: llm.before
      plugin_type: prompt
      order: 100
      enabled: false
      config:
        role: system
        content: "你必须优先复用已有代码风格，修改前先观察上下文。"
memory:
  type: "jsonl"
sse:
  heartbeat_seconds: 15
  replay_on_connect: true
human_in_the_loop:
  enabled: true
logging:
  level: "INFO"
  format: "json"
  redact_secrets: true
