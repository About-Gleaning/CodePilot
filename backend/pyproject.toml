[project]
name = "codepilot-backend"
version = "0.1.0"
description = "CodePilot backend skeleton"
readme = "../README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiofiles>=24.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "litellm>=1.84.0,<1.85",
  "lxml>=5.0.0",
  "mcp>=1.28,<2",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyee>=12.1.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "structlog>=24.4.0",
  "trafilatura>=2.0.0",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
markitdown = [
  "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.6,<0.2",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
]
