[project]
name = "codepilot-backend"
version = "0.1.0"
description = "CodePilot backend skeleton"
readme = "../README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiofiles>=24.1.0",
  "fastapi>=0.115.0",
  "litellm>=1.68.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyee>=12.1.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "structlog>=24.4.0",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
